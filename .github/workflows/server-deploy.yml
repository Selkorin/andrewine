name: Deploy production server

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect the server or deploy the site
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - deploy
          - verify-form

permissions:
  contents: read

jobs:
  inspect:
    if: inputs.mode == 'inspect'
    runs-on: ubuntu-latest
    steps:
      - name: Check public DNS and HTTPS
        run: |
          echo '--- public DNS ---'
          dig +short A andrewine.ru @1.1.1.1
          dig +short AAAA andrewine.ru @1.1.1.1
          dig +short NS andrewine.ru @1.1.1.1
          echo '--- authoritative AAAA ---'
          dig +short AAAA andrewine.ru @ns1.timeweb.ru
          dig +short AAAA www.andrewine.ru @ns1.timeweb.ru
          echo '--- public HTTPS IPv4 ---'
          curl -4 -fsSIL --connect-timeout 10 --max-time 20 https://andrewine.ru/ | head -20
          echo '--- public HTTPS IPv6 ---'
          curl -6 -sSIL --connect-timeout 10 --max-time 20 https://andrewine.ru/ | head -20 || true
      - name: Inspect Nginx and web roots
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          password: ${{ secrets.PRODUCTION_PASSWORD }}
          timeout: 60s
          command_timeout: 2m
          script: |
            hostname
            echo '--- nginx roots ---'
            grep -R "server_name\|root " /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -120 || true
            echo '--- web directories ---'
            find /var/www -maxdepth 3 -type d 2>/dev/null | head -120 || true
            echo '--- containers ---'
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}' 2>/dev/null || true
            echo '--- network and firewall ---'
            ip -6 addr show scope global 2>/dev/null || true
            ufw status verbose 2>/dev/null || true
            iptables -S INPUT 2>/dev/null | head -80 || true
            ip6tables -S INPUT 2>/dev/null | head -80 || true
            fail2ban-client status 2>/dev/null || true
            echo '--- andrewine nginx config ---'
            sed -n '1,240p' /etc/nginx/sites-enabled/andrewine.ru 2>/dev/null || true
            echo '--- application stack location ---'
            docker inspect alcohol-evaluation-platform-backend-1 --format 'WorkingDir={{.Config.WorkingDir}} Labels={{json .Config.Labels}} Mounts={{json .Mounts}}' 2>/dev/null || true
            echo '--- backend routes ---'
            for path in /openapi.json /api/openapi.json /api/docs; do curl -sS -o /tmp/backend-route.out -w "$path HTTP %{http_code}\n" "http://127.0.0.1:8081$path" || true; head -c 240 /tmp/backend-route.out; echo; done
            echo '--- application endpoint source ---'
            grep -R -n -E 'applications/web|def .*application|UploadFile|photos' /root/alcohol-evaluation-platform/backend 2>/dev/null | head -120 || true
            sed -n '100,172p' /root/alcohol-evaluation-platform/backend/app/api/applications.py 2>/dev/null || true
            echo '--- endpoint preflight ---'
            curl -sS -o /tmp/quiz-preflight.out -w 'HTTP %{http_code}\n' -X POST http://127.0.0.1:8081/api/applications/web || true
            head -c 800 /tmp/quiz-preflight.out 2>/dev/null || true

  deploy:
    if: inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and verify
        run: npm ci && ASTRO_TELEMETRY_DISABLED=1 npm run build
      - name: Package site
        run: tar -C dist -czf /tmp/andrewine-site.tar.gz .
      - name: Upload package
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          password: ${{ secrets.PRODUCTION_PASSWORD }}
          timeout: 60s
          source: /tmp/andrewine-site.tar.gz
          target: /tmp
          strip_components: 1
      - name: Activate release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          password: ${{ secrets.PRODUCTION_PASSWORD }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -eu
            site_root="${{ secrets.PRODUCTION_WEB_ROOT }}"
            test -n "$site_root"
            test "$site_root" != "/"
            mkdir -p "$site_root"
            backup="${site_root}.backup-$(date +%Y%m%d-%H%M%S)"
            cp -a "$site_root" "$backup"
            find "$site_root" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            tar -xzf /tmp/andrewine-site.tar.gz -C "$site_root"
            rm -f /tmp/andrewine-site.tar.gz
            nginx -t
            curl -fsS -H 'Host: andrewine.ru' http://127.0.0.1/ >/dev/null
            echo "Deployed to $site_root; backup: $backup"

  verify-form:
    if: inputs.mode == 'verify-form'
    runs-on: ubuntu-latest
    steps:
      - name: Submit and confirm a test application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          password: ${{ secrets.PRODUCTION_PASSWORD }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -eu
            test_png=/tmp/andrewine-form-test.png
            printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > "$test_png"
            code=$(curl -sS -o /tmp/andrewine-form-response.json -w '%{http_code}' \
              -F 'category=Проверка онлайн-теста' \
              -F 'name=Проверка сайта' \
              -F 'phone=+7 999 000-00-01' \
              -F 'message=Автоматическая проверка отправки теста в админ-панель' \
              -F 'source=https://andrewine.ru/#online-valuation' \
              -F 'website=' \
              -F "photos=@$test_png;type=image/png" \
              http://127.0.0.1:8081/api/applications/web)
            test "$code" = "201"
            uuid=$(python3 -c 'import json; print(json.load(open("/tmp/andrewine-form-response.json"))["uuid"])')
            test -n "$uuid"
            grep -q 'Проверка онлайн-теста' /tmp/andrewine-form-response.json
            python3 - "$uuid" <<'PY'
            import glob, os, sqlite3, sys
            target = sys.argv[1]
            for path in glob.glob('/var/lib/docker/volumes/alcohol-evaluation-platform_backend_db/_data/**/*', recursive=True):
                if not os.path.isfile(path):
                    continue
                try:
                    db = sqlite3.connect(path)
                    tables = {row[0] for row in db.execute("select name from sqlite_master where type='table'")}
                    if 'applications' not in tables:
                        db.close(); continue
                    row = db.execute('select uuid, title from applications where uuid = ?', (target,)).fetchone()
                    db.close()
                    if row:
                        print(f'Admin database contains test application: {row[0]} | {row[1]}')
                        break
                except sqlite3.DatabaseError:
                    continue
            else:
                raise SystemExit('Test application was not found in the admin database')
            PY
            rm -f "$test_png" /tmp/andrewine-form-response.json
